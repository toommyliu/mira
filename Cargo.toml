[package]
name = "mira"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/toommyliu/mira"

[workspace]
members = ["crates/platform", "crates/ui"]

[workspace.lints.clippy]
disallowed_methods = "deny"

[workspace.dependencies]
anyhow = "1"
collections = { git = "https://github.com/zed-industries/zed", rev = "985bbf42e684ef5b5a9312a6abf075aeafbaf5b9" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "985bbf42e684ef5b5a9312a6abf075aeafbaf5b9", default-features = false }
gpui_apple = { git = "https://github.com/zed-industries/zed", rev = "985bbf42e684ef5b5a9312a6abf075aeafbaf5b9" }
gpui_macos = { git = "https://github.com/zed-industries/zed", rev = "985bbf42e684ef5b5a9312a6abf075aeafbaf5b9", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "985bbf42e684ef5b5a9312a6abf075aeafbaf5b9", features = ["font-kit"] }
mira-platform = { path = "crates/platform" }
mira-ui = { path = "crates/ui" }
unicode-segmentation = "1"

[dependencies]
anyhow.workspace = true
arboard = { version = "3.7", default-features = false }
async-channel = "2.5"
async-task = "4.7"
block2 = "0.6"
cpal = "0.16"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
encoding_rs = "0.8.35"
getrandom = "0.2"
hex = "0.4"
gpui.workspace = true
libc = "0.2"
mira-platform.workspace = true
mira-ui.workspace = true
objc2 = "0.6"
percent-encoding = "2"
oxc = { version = "0.157", features = ["codegen", "semantic", "transformer"] }
objc2-app-kit = { version = "0.3", features = ["NSAlert", "NSApplication", "NSButton", "NSColor", "NSControl", "NSView", "NSResponder", "NSGraphics", "NSWindow"] }
objc2-core-graphics = "0.3"
objc2-foundation = { version = "0.3", features = ["NSBundle", "NSDate", "NSDateFormatter", "NSError", "NSFileManager", "NSFormatter", "NSGeometry", "NSLocale", "NSNotification", "NSPathUtilities", "NSURL"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CAMetalLayer", "CATransaction"] }
raw-window-handle = "0.6"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "native-tls", "stream"] }
rquickjs = { version = "0.14", features = ["loader"] }
ruffle_core = { git = "https://github.com/toommyliu/ruffle", rev = "12ed6c1183b2b3a51597ee245ea6dff43e99cc6a", features = ["aac", "audio", "default_compatibility_rules", "default_font", "lzma", "mp3", "nellymoser", "stats"] }
ruffle_frontend_utils = { git = "https://github.com/toommyliu/ruffle", rev = "12ed6c1183b2b3a51597ee245ea6dff43e99cc6a", default-features = false, features = ["cpal", "fs"] }
ruffle_render = { git = "https://github.com/toommyliu/ruffle", rev = "12ed6c1183b2b3a51597ee245ea6dff43e99cc6a" }
ruffle_render_wgpu = { git = "https://github.com/toommyliu/ruffle", rev = "12ed6c1183b2b3a51597ee245ea6dff43e99cc6a" }
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize"] }
semver = "1"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
zip = { version = "8", default-features = false, features = ["deflate"] }

[features]
storyboard = []

[lints]
workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
mira-ui = { workspace = true, features = ["test-support"] }
swf = { git = "https://github.com/toommyliu/ruffle", rev = "12ed6c1183b2b3a51597ee245ea6dff43e99cc6a" }
tokio = { version = "1", features = ["test-util"] }

[patch.crates-io]
naga = { git = "https://github.com/toommyliu/ruffle", rev = "12ed6c1183b2b3a51597ee245ea6dff43e99cc6a" }
wgpu-core = { git = "https://github.com/toommyliu/ruffle", rev = "12ed6c1183b2b3a51597ee245ea6dff43e99cc6a" }
wgpu-hal = { git = "https://github.com/toommyliu/ruffle", rev = "12ed6c1183b2b3a51597ee245ea6dff43e99cc6a" }
wgpu-types = { git = "https://github.com/toommyliu/ruffle", rev = "12ed6c1183b2b3a51597ee245ea6dff43e99cc6a" }


[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
