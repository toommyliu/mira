[package]
name = "mira-ui"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[features]
test-support = ["dep:gpui_apple", "dep:image", "dep:mira-platform", "gpui/test-support"]

[dependencies]
anyhow.workspace = true
gpui.workspace = true
gpui_apple = { workspace = true, optional = true, features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
mira-platform = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"] }
unicode-segmentation.workspace = true

[lints]
workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform.workspace = true
mira-ui = { path = ".", features = ["test-support"] }
