name: Release

on:
  schedule:
    - cron: "8,38 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, like 0.2.0
        required: true
      notes:
        description: Release notes, one "- " bullet per change
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.nightly.outputs.ready }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/nightly.ts check

  release:
    needs: plan
    permissions:
      contents: write
      actions: read
    name: Release
    if: |
      !cancelled() && (
        (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch) ||
        (needs.plan.result == 'success' && needs.plan.outputs.ready == 'true')
      )
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event_name == 'schedule' && github.sha || github.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile --filter mira --filter @mira/runtime
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fetch --locked
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-about@0.9.3
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/nightly.ts publish
      - if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          pnpm release ci "$VERSION" --notes "$RUNNER_TEMP/notes.md"
